name: Daily AQI Forecast Engine

on:
  schedule:
    # Triggers daily at 1:00 AM IST (Indian Standard Time: UTC + 5:30 -> 19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install ML & Math Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run AQI Forecast Engine & Sync Supabase
        env:
          KERAS_BACKEND: torch
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOURCE_AQI_TABLE: AQI_NODE1
          TABLE_WEATHER_HISTORICAL: WEATHER_NODE1
        run: |
          python php-backend/generate_forecast.py
